services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./livekit.effective.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # マスター画面のサーバーリソース表示用。VPS自体のCPU/RAM/帯域/接続数を
  # 収集するPrometheus公式のOS監視エージェント。127.0.0.1:9100にのみ
  # bindするため外部からは到達不可(caddyコンテナも同じくhostネットワーク
  # なのでlocalhost:9100へreverse_proxy可能)。ファイアウォール変更は不要。
  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.netdev.device-exclude=^(lo|docker.*|veth.*|br-.*|virbr.*|tun.*|tap.*)$
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
