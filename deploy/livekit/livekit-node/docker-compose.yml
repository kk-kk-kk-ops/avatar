services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./livekit.effective.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
